<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Batcave</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">
    <h1>Acces a la Batcave</h1>

    <!-- Formulaire HTML classique : pas de fetch() ici.
         Le navigateur envoie lui-meme les champs en POST sur /auth/login,
         et suivra la redirection renvoyee par le serveur. -->
    <form action="/auth/login" method="POST" class="col-md-4">
        <div class="mb-3">
            <label for="username" class="form-label">Nom d'utilisateur</label>
            <input type="text" class="form-control" id="username" name="username" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Mot de passe</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-dark">Se connecter</button>
    </form>
</body>
</html>
